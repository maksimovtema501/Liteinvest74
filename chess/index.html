<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Шахматы</title>
<meta name="description" content="Шахматы с тренером: игра с ботами и с друзьями по сети, задачи, штурм, уроки, дебюты, разбор партий с оценкой каждого хода.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#262421">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Шахматы">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#302e2b; --panel:#262421; --panel2:#3a3835; --panel3:#45423e; --line:#3f3c38; --line2:#55524d;
  --text:#ffffffe6; --muted:#b9b7b3; --dim:#8b8987;
  --green:#81b64c; --green-d:#5d8b34; --green-l:#a3d160;
  --amber:#f7c045; --orange:#e58f2a; --red:#e04f43; --blue:#5d9bd5; --teal:#26c2a3; --violet:#a78bfa;
  --sq-light:#ebecd0; --sq-dark:#739552;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  --nav-h:60px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  user-select:none; -webkit-user-select:none;
}
input,textarea,select{user-select:text;-webkit-user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:var(--green-l)}
h1,h2,h3{margin:0;letter-spacing:-.2px}
.hidden{display:none!important}
@media (max-width:899px){ .desk-only{display:none!important} }
@media (min-width:900px){ .mob-only{display:none!important} }

/* ---------- каркас: боковая панель на компьютере, нижняя — на телефоне ---------- */
#side{
  position:fixed;left:0;top:0;bottom:0;width:190px;background:var(--panel);
  display:flex;flex-direction:column;padding:14px 8px;gap:2px;z-index:30;
}
#side .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;padding:4px 10px 14px}
#side .logo span{font-size:28px}
#side button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;font-weight:600;color:var(--muted);text-align:left}
#side button .ico{font-size:21px;width:26px;text-align:center}
#side button:hover{background:var(--panel2);color:var(--text)}
#side button.on{background:var(--panel2);color:#fff}
#side .grow{flex:1}
#nav{display:none}
#app{margin-left:190px;min-height:100%}
#view{padding:20px 22px 40px;max-width:1240px;margin:0 auto}

@media (max-width:899px){
  #side{display:none}
  #app{margin-left:0}
  #view{padding:calc(var(--safe-t) + 10px) 12px calc(var(--safe-b) + var(--nav-h) + 20px)}
  #nav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
    background:rgba(38,36,33,.97); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); padding-bottom:var(--safe-b);
  }
  #nav button{flex:1;min-width:0;padding:8px 2px 7px;font-size:10.5px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #nav button .ico{font-size:22px;line-height:1.1}
  #nav button.on{color:#fff}
  body.immersive #nav{display:none}
  body.immersive #view{padding:var(--safe-t) 0 calc(var(--safe-b) + 10px)}
}

/* ---------- общие элементы ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:40px}
.topbar h1{font-size:22px}
.topbar .sp{flex:1}
.back{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--panel2);flex-shrink:0}
.iconbtn{width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;background:var(--panel2);flex-shrink:0}
.iconbtn:active,.back:active{background:var(--panel3)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 16px;border-radius:9px;background:var(--panel3);
  font-weight:700;font-size:15px;box-shadow:0 3px 0 #00000055;transition:filter .1s;
  min-height:44px;text-align:center;line-height:1.2;
}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #00000055}
.btn.primary{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);text-shadow:0 1px 1px #0003}
.btn.big{font-size:20px;padding:16px 22px;min-height:60px;border-radius:12px}
.btn.danger{background:#a33a32}
.btn.ghost{background:transparent;box-shadow:none;border:1px solid var(--line2)}
.btn.sm{padding:7px 11px;font-size:13.5px;min-height:34px}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:13px} .tiny{font-size:11.5px}
.green{color:var(--green-l)} .red{color:#ff7b6e} .amber{color:var(--amber)}
.b{font-weight:700}
.card{background:var(--panel);border-radius:12px;padding:14px}
.card + .card{margin-top:12px}
.card h2{font-size:17px;margin-bottom:8px}
.card h3{font-size:15px;margin-bottom:6px}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:20px 2px 8px}
.tile{
  background:var(--panel);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;
  text-align:left;width:100%;transition:background .1s;
}
.tile:hover{background:var(--panel2)}
.tile .ti{font-size:30px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:10px;background:var(--panel2)}
.tile .tt{font-weight:700;font-size:15.5px}
.tile .ts{font-size:13px;color:var(--muted);margin-top:1px}
.tile .tr{margin-left:auto;color:var(--dim);font-size:13px;text-align:right;flex-shrink:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 12px;border-radius:999px;background:var(--panel2);font-weight:600;font-size:13.5px;border:2px solid transparent}
.chip.on{border-color:var(--green);background:#81b64c22;color:#fff}
.chip.sm{padding:5px 10px;font-size:12.5px}
.seg{display:flex;background:var(--panel2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--panel3);color:#fff}
.tag{display:inline-block;padding:2px 7px;border-radius:6px;background:var(--panel2);font-size:11.5px;font-weight:600;color:var(--muted)}
.bar{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--green);border-radius:5px}
.stat{background:var(--panel2);border-radius:10px;padding:10px 12px}
.stat .v{font-size:22px;font-weight:800}
.stat .l{font-size:12px;color:var(--muted)}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
input[type=text],input[type=password],input[type=number],textarea,select{
  width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:10px 12px;outline:none;
}
input:focus,textarea:focus{border-color:var(--green)}
textarea{resize:vertical;min-height:80px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
label.sw{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
label.sw:last-child{border-bottom:0}
label.sw .lt{flex:1}
label.sw .ls{display:block;font-size:12.5px;color:var(--muted)}
.toggle{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--panel3);position:relative;cursor:pointer;flex-shrink:0;transition:background .15s}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.toggle:checked{background:var(--green)}
.toggle:checked::after{left:21px}
.prose p{margin:0 0 10px;line-height:1.55}
.prose ul,.prose ol{margin:0 0 10px;padding-left:20px;line-height:1.55}
.prose li{margin-bottom:4px}
.prose b{color:#fff}

/* ---------- модальные окна, шторки, тосты ---------- */
#overlay{position:fixed;inset:0;background:#000a;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:var(--panel);border-radius:16px;width:100%;max-width:420px;max-height:calc(100dvh - 32px);overflow:auto;padding:20px;box-shadow:0 20px 60px #0008;animation:pop .18s}
.modal.wide{max-width:640px}
.modal h2{font-size:21px;margin-bottom:8px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.94);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 84px);transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;z-index:80;font-weight:600;font-size:14px;box-shadow:0 8px 24px #0008;max-width:calc(100vw - 32px);text-align:center;animation:fade .2s}

/* ---------- доска ---------- */
.cb{position:relative;width:100%;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;container-type:inline-size}
.cb-sqs{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:3px;overflow:hidden}
.sq{position:relative;background:var(--sq-light)}
.sq.d{background:var(--sq-dark)}
.sq::after{content:"";position:absolute;inset:0;pointer-events:none}
.sq.last::after{background:rgba(255,255,51,.42)}
.sq.sel::after{background:rgba(255,255,51,.55)}
.sq.pre::after{background:rgba(214,79,0,.45)}
.sq.hl-red::after{background:rgba(235,97,80,.7)}
.sq.hl-green::after{background:rgba(129,182,76,.6)}
.sq.hl-blue::after{background:rgba(82,176,220,.6)}
.sq.hl-yellow::after{background:rgba(255,199,0,.6)}
.sq.star::before{content:"★";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:7cqw;color:#f5b301;text-shadow:0 1px 2px #0006;z-index:1}
.sq.check::after{background:radial-gradient(ellipse at center,rgba(255,0,0,1) 0%,rgba(231,0,0,1) 25%,rgba(169,0,0,0) 89%,rgba(158,0,0,0) 100%)}
.sq.dest::before{content:"";position:absolute;left:34%;top:34%;width:32%;height:32%;border-radius:50%;background:rgba(0,0,0,.16);z-index:3;pointer-events:none}
.sq.dest.occ::before{left:0;top:0;width:100%;height:100%;background:transparent;border-radius:50%;box-shadow:inset 0 0 0 0.9cqw rgba(0,0,0,.16)}
.sq.hover{box-shadow:inset 0 0 0 0.55cqw rgba(255,255,255,.75)}
.sq .co{position:absolute;font-size:2.4cqw;font-weight:700;pointer-events:none;line-height:1;z-index:2}
.sq .co.r{left:4%;top:4%}
.sq .co.f{right:5%;bottom:3%}
.sq .co{color:var(--sq-dark)} .sq.d .co{color:var(--sq-light)}
.cb-pcs{position:absolute;inset:0;pointer-events:none}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;background-size:100% 100%;background-repeat:no-repeat;will-change:transform;z-index:4}
.pc.anim{transition:transform var(--anim,200ms) cubic-bezier(.3,.7,.4,1)}
.pc.lift{opacity:.35}
.pc.fadeout{transition:opacity .15s;opacity:0}
.pc-ghost{position:fixed;pointer-events:none;z-index:100;background-size:100% 100%;transform:translate(-50%,-50%) scale(1.12);filter:drop-shadow(0 6px 8px #0006)}
.cb-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.cb-badges{position:absolute;inset:0;pointer-events:none;z-index:7}
.cb-badge{position:absolute;width:5.4%;height:5.4%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.6cqw;font-weight:900;color:#fff;box-shadow:0 1px 3px #0007;transform:translate(-55%,-40%)}
.cb-promo{position:absolute;inset:0;background:#0007;z-index:20;display:flex}
.cb-promo .col{position:absolute;width:12.5%;display:flex;flex-direction:column;background:#fff;border-radius:4px;box-shadow:0 6px 20px #000a;overflow:hidden;gap:0}
.cb-promo button{width:100%;aspect-ratio:1;background-size:88% 88%;background-repeat:no-repeat;background-position:center}
.cb-promo button:hover{background-color:#e0e0e0}
.cb.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-1.2%)}40%{transform:translateX(1.2%)}60%{transform:translateX(-.8%)}80%{transform:translateX(.6%)}}
.cb-flash{position:absolute;width:12.5%;height:12.5%;z-index:8;pointer-events:none;display:flex;align-items:flex-start;justify-content:flex-end}
.cb-flash i{font-style:normal;width:42%;height:42%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3cqw;font-weight:900;color:#fff;margin:-8% -8% 0 0;box-shadow:0 2px 6px #0008;animation:pop .2s}

/* ---------- экран партии ---------- */
.gtop{display:none}
.say{position:absolute;left:52px;top:100%;margin-top:4px;background:#fff;color:#222;font-size:13px;font-weight:600;padding:6px 10px;border-radius:10px;z-index:15;max-width:240px;box-shadow:0 4px 14px #0006;animation:pop .2s}
.say::before{content:"";position:absolute;left:14px;top:-6px;border:6px solid transparent;border-top:0;border-bottom-color:#fff}
.pbar{position:relative}
.play{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px;align-items:start}
.play-main{display:flex;flex-direction:column;align-items:center;min-width:0}
.board-col{width:min(100%, calc(100dvh - 150px));display:flex;flex-direction:column;gap:6px}
.board-row{display:flex;gap:6px;align-items:stretch}
.board-row .cb{flex:1;min-width:0}
.pbar{display:flex;align-items:center;gap:9px;min-height:44px;padding:0 2px}
.pbar .av{width:38px;height:38px;border-radius:6px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.pbar .nm{font-weight:700;font-size:14.5px;line-height:1.15;display:flex;gap:5px;align-items:center;min-width:0}
.pbar .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar .rt{color:var(--dim);font-weight:500}
.pbar .caps{font-size:13px;color:var(--muted);height:18px;display:flex;align-items:center;gap:0;line-height:1}
.pbar .caps img{width:17px;height:17px;margin-right:-6px}
.pbar .caps b{margin-left:9px;font-size:12px}
.pbar .info{min-width:0;flex:1}
.clock{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:23px;padding:5px 11px;border-radius:6px;background:#989795;color:#2b2a28;min-width:96px;text-align:right;flex-shrink:0}
.clock.run{background:#fff;color:#222}
.clock.low.run{background:#e04f43;color:#fff}
.clock.dark{background:#262421;color:#777}
.clock.dark.run{background:#3a3835;color:#fff}
.thinking{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.thinking i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.thinking i:nth-child(2){animation-delay:.2s} .thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.2}}
.evalbar{width:18px;border-radius:3px;overflow:hidden;background:#403d39;position:relative;flex-shrink:0}
.evalbar .w{position:absolute;left:0;right:0;bottom:0;background:#fff;transition:height .4s}
.evalbar.flip .w{bottom:auto;top:0}
.evalbar .t{position:absolute;left:0;right:0;font-size:8.5px;font-weight:800;text-align:center;z-index:2}
.side{background:var(--panel);border-radius:12px;display:flex;flex-direction:column;min-height:0;max-height:calc(100dvh - 60px);position:sticky;top:20px;overflow:hidden}
.side-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.side-body{flex:1;overflow:auto;min-height:120px}
.side-foot{padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.moves{display:grid;grid-template-columns:42px 1fr 1fr;font-size:14.5px;align-content:start}
.moves .n{color:var(--dim);padding:5px 8px;background:#2b2926}
.moves .m{padding:5px 8px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:5px;border-radius:4px;white-space:nowrap}
.moves .m:hover{background:var(--panel2)}
.moves .m.cur{background:#4b4847;color:#fff}
.moves .m .ci{width:15px;height:15px;font-size:9px}
.mstrip{display:flex;gap:2px;overflow-x:auto;padding:6px 8px;background:var(--panel);font-size:14px;scrollbar-width:none;white-space:nowrap;min-height:34px;align-items:center}
.mstrip::-webkit-scrollbar{display:none}
.mstrip .n{color:var(--dim);padding:2px 2px 2px 6px}
.mstrip .m{padding:3px 6px;border-radius:4px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.mstrip .m.cur{background:#4b4847;color:#fff}
.ctrl{display:flex;gap:6px;justify-content:center;padding:6px 0}
.ctrl button{flex:1;max-width:72px;height:42px;border-radius:8px;background:var(--panel2);font-size:18px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0}
.ctrl button small{font-size:10px;color:var(--muted);font-weight:600;line-height:1}
.ctrl button:active{background:var(--panel3)}
.ctrl button.on{background:var(--green-d)}
.ctrl button:disabled{opacity:.35}
.coachbox{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--panel);border-radius:10px;width:100%}
.coachbox .ca{font-size:30px;line-height:1;flex-shrink:0}
.coachbox .cm{flex:1;font-size:14px;line-height:1.45;min-width:0}
.coachbox .cm b{color:#fff}
.coachbox .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ci{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:900;color:#fff;flex-shrink:0;line-height:1}
.c-brilliant{background:#1baca6} .c-great{background:#5c8bb0} .c-best{background:#81b64c} .c-excellent{background:#96bc4b}
.c-good{background:#77915f} .c-book{background:#a88865} .c-inaccuracy{background:#f7c631} .c-mistake{background:#ffa459}
.c-miss{background:#ff7769} .c-blunder{background:#fa412d} .c-forced{background:#868686}
.chat{display:flex;flex-direction:column;gap:6px;padding:10px 12px}
.chat .msg{max-width:90%;padding:7px 11px;border-radius:12px;background:var(--panel2);font-size:14px;line-height:1.4;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.chat .msg.me{align-self:flex-end;background:#3d5a26}
.chat .msg.sys{align-self:center;background:transparent;color:var(--dim);font-size:12.5px;padding:2px}
.chat .who{font-size:11px;color:var(--dim);margin-bottom:1px}
.gameover{text-align:center}
.gameover .res{font-size:28px;font-weight:800}
.gameover .why{color:var(--muted);margin-top:2px}
.vs{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0}
.vs .p{display:flex;flex-direction:column;align-items:center;gap:4px;width:110px}
.vs .p .av{font-size:40px;width:64px;height:64px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;justify-content:center}
.vs .p.win .av{box-shadow:0 0 0 3px var(--green)}

@media (max-width:899px){
  .play{display:block}
  .board-col{width:min(100vw, calc(100dvh - 228px - var(--safe-t) - var(--safe-b)));margin:0 auto}
  .pbar{padding:0 8px}
  .side{position:static;max-height:none;border-radius:0;background:transparent;overflow:visible}
  .side-foot{order:-1;border-top:0;padding:6px 0 0}
  .side-head{padding:6px 12px;border-bottom:0}
  .side-body{min-height:0}
  .gtop{display:flex;align-items:center;gap:8px;padding:6px 8px;width:100%}
  .gtop .tt{flex:1;font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ctrl{padding:6px 8px}
  .coachbox{border-radius:0}
  .board-row{gap:0}
  .board-row .evalbar{width:12px;border-radius:0}
  .board-row .evalbar .t{font-size:6.5px}
  .cb-sqs{border-radius:0}
}

/* ---------- задачи, обучение, разбор ---------- */
.pz-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--panel);width:100%}
.pz-head .who{width:22px;height:22px;border-radius:4px;flex-shrink:0;border:2px solid #777}
.pz-head .who.w{background:#fff} .pz-head .who.b{background:#000}
.pz-head .tx{font-weight:700;font-size:15.5px}
.pz-head.ok{background:#3c5a24} .pz-head.bad{background:#6b2a24}
.strikes{display:flex;gap:4px}
.strikes i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.strikes i.x{background:var(--red);color:#fff}
.rushlist{display:flex;flex-wrap:wrap;gap:4px;padding:8px}
.rushlist i{font-style:normal;width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.rushlist i.ok{background:var(--green)} .rushlist i.bad{background:var(--red)}
.bigtimer{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center}
.lesson-text{font-size:15px;line-height:1.6}
.lesson-text p{margin:0 0 10px}
.lesson-text b{color:#fff}
.progress-dots{display:flex;gap:5px;flex-wrap:wrap}
.progress-dots i{width:12px;height:12px;border-radius:50%;background:var(--panel3)}
.progress-dots i.ok{background:var(--green)} .progress-dots i.cur{box-shadow:0 0 0 2px #fff}
.mini{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border-radius:4px;overflow:hidden;width:100%}
.mini i{background:var(--sq-light);background-size:100% 100%}
.mini i.d{background-color:var(--sq-dark)}
.graph{width:100%;height:110px;display:block;border-radius:8px;background:#403d39;cursor:pointer}
.acc{display:flex;gap:10px;align-items:stretch}
.acc .p{flex:1;background:var(--panel2);border-radius:10px;padding:10px;text-align:center}
.acc .p .v{font-size:26px;font-weight:800}
.acc .p.w .v{color:#fff} .acc .p.bk .v{color:#cfcfcf}
.cls-table{width:100%;border-collapse:collapse;font-size:14px}
.cls-table td{padding:5px 4px}
.cls-table td:nth-child(1),.cls-table td:nth-child(4){text-align:center;font-weight:700;width:44px}
.cls-table td:nth-child(2){text-align:center;width:30px}
.lines{font-size:13.5px}
.lines .ln{display:flex;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:baseline}
.lines .ln:hover{background:var(--panel2)}
.lines .ev{font-weight:800;min-width:46px;text-align:center;padding:1px 5px;border-radius:4px;background:#fff;color:#222;font-size:12.5px}
.lines .ev.neg{background:#333;color:#fff}
.lines .pv{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--panel2)}
.heat i.l1{background:#3d5a26} .heat i.l2{background:#5d8b34} .heat i.l3{background:#81b64c} .heat i.l4{background:#a3d160}
.bot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.bot{background:var(--panel);border-radius:10px;padding:10px 6px;text-align:center;border:2px solid transparent;position:relative}
.bot.on{border-color:var(--green);background:#81b64c1a}
.bot .av{font-size:34px;line-height:1.1}
.bot .nm{font-weight:700;font-size:13px;margin-top:3px;line-height:1.15}
.bot .rt{font-size:12px;color:var(--muted)}
.bot .medal{position:absolute;top:4px;right:6px;font-size:14px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach .a{background:var(--panel2);border-radius:10px;padding:10px;display:flex;gap:8px;align-items:center;opacity:.45}
.ach .a.got{opacity:1}
.ach .a .ai{font-size:26px}
.ach .a .at{font-weight:700;font-size:13px;line-height:1.2}
.ach .a .as{font-size:11.5px;color:var(--muted);line-height:1.25}
.plan .step{display:flex;gap:12px;align-items:center;padding:12px;border-radius:10px;background:var(--panel2);width:100%;text-align:left}
.plan .step + .step{margin-top:8px}
.plan .step .ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:900}
.plan .step.done .ck{background:var(--green);border-color:var(--green);color:#fff}
.plan .step.done .st{text-decoration:line-through;color:var(--muted)}
.palette{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.palette button{aspect-ratio:1;border-radius:6px;background:var(--panel2);background-size:80% 80%;background-repeat:no-repeat;background-position:center;font-size:18px}
.palette button.on{box-shadow:0 0 0 2px var(--green);background-color:#81b64c33}
.hero{background:linear-gradient(135deg,#3b5a24,#262421 70%);border-radius:14px;padding:18px;display:flex;gap:16px;align-items:center}
.hero .hi{font-size:46px}
.hero h1{font-size:23px}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--panel2);padding:1px 5px;border-radius:4px;user-select:all;-webkit-user-select:all;word-break:break-all}
</style>
