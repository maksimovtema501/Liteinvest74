<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Лингво</title>
<meta name="description" content="Английский за полгода–год: тест уровня, интервальные повторения, шэдоуинг, диктанты, грамматика и говорение каждый день.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#020617">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Лингво">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#020617; --panel:#0f172a; --panel2:#1e293b; --line:#1e293b; --line2:#334155;
  --text:#e2e8f0; --muted:#94a3b8; --dim:#64748b;
  --violet:#8b5cf6; --cyan:#22d3ee; --emerald:#10b981; --amber:#f59e0b; --red:#ef4444;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  user-select:none; -webkit-user-select:none;
}
input,textarea{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- каркас ---------- */
#head{
  position:sticky; top:0; z-index:20; background:rgba(2,6,23,.92);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
  padding:calc(var(--safe-t) + 10px) 14px 10px;
}
.head-row{display:flex;align-items:center;gap:10px}
.head-title{font-size:19px;font-weight:700;letter-spacing:-.3px}
.head-sub{font-size:12px;color:var(--muted);margin-top:2px}
.head-actions{margin-left:auto;display:flex;gap:8px;flex-shrink:0;align-items:center}
main{padding:14px 14px calc(var(--safe-b) + 96px);max-width:640px;margin:0 auto}
#nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(15,23,42,.96); backdrop-filter:blur(12px);
  border-top:1px solid var(--line); padding-bottom:var(--safe-b);
}
#nav button{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:11px 2px 9px;font-size:10.5px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px}
#nav button .ico{font-size:21px;line-height:1}
#nav button.on{color:var(--violet)}
.view{display:none}
.view.on{display:block}

/* ---------- общие элементы ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 16px;border-radius:12px;background:var(--panel2);
  border:1px solid var(--line2);font-weight:600;font-size:15px;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.primary{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.green{background:var(--emerald);border-color:var(--emerald);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:#fecaca;border-color:#7f1d1d;background:rgba(239,68,68,.1)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.big{padding:16px 18px;font-size:17px;border-radius:14px}
.btn.wide{width:100%}
.icon-btn{
  width:38px;height:38px;border-radius:11px;background:var(--panel2);
  border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
}
.icon-btn:active{transform:scale(.94)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card.accent{border-color:rgba(139,92,246,.5);background:linear-gradient(160deg,rgba(139,92,246,.16),rgba(34,211,238,.05) 70%),var(--panel)}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.small{font-size:13px}
.empty{text-align:center;color:var(--dim);font-size:14px;padding:22px 10px;line-height:1.6}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.sp{margin-left:auto}
.gap8{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sect-title{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);margin:18px 2px 8px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text)}
.progress{height:8px;border-radius:999px;background:var(--panel2);overflow:hidden}
.progress > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--violet),var(--cyan));transition:width .45s cubic-bezier(.2,.8,.2,1)}
.progress.full > i{background:linear-gradient(90deg,var(--emerald),#34d399)}
.lvl{display:inline-flex;align-items:center;justify-content:center;min-width:40px;padding:4px 9px;border-radius:9px;font-weight:800;font-size:13px;letter-spacing:.3px;background:rgba(139,92,246,.18);color:#c4b5fd}
.lvl.A1,.lvl.A0{background:rgba(16,185,129,.16);color:#6ee7b7}
.lvl.A2{background:rgba(34,211,238,.14);color:#67e8f9}
.lvl.B1{background:rgba(139,92,246,.18);color:#c4b5fd}
.lvl.B2{background:rgba(245,158,11,.16);color:#fcd34d}
.lvl.C1{background:rgba(239,68,68,.16);color:#fca5a5}
.chip{font-size:11px;padding:3px 8px;border-radius:7px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.chip.ok{color:#6ee7b7;background:rgba(16,185,129,.12)}
.chip.learn{color:#67e8f9;background:rgba(34,211,238,.1)}
.chip.due{color:#fcd34d;background:rgba(245,158,11,.12)}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.coach{font-size:14px;color:#ddd6fe;line-height:1.45}
.coach b{color:#fff}

/* ---------- сегодня ---------- */
.today-top{display:flex;gap:14px;align-items:center}
.ring{position:relative;width:86px;height:86px;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.ring .n small{font-size:10px;font-weight:600;color:var(--muted)}
.step{display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;width:100%;text-align:left}
.step:active{transform:scale(.99)}
.step .si{width:38px;height:38px;border-radius:11px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.step .sb{flex:1;min-width:0}
.step .st{font-weight:650;font-size:15px}
.step .ss{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step.done{opacity:.6}
.step.done .si{background:rgba(16,185,129,.18)}
.step .sk{font-size:18px;color:var(--emerald)}
.inp-row{display:flex;gap:6px;flex-wrap:wrap}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:15px;color:#fdba74}

/* ---------- списки ---------- */
.li{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;width:100%;text-align:left}
.li:active{transform:scale(.995)}
.li .lb{flex:1;min-width:0}
.li .lt{font-weight:600;font-size:15px;word-break:break-word}
.li .ls{font-size:13px;color:var(--muted);margin-top:1px;word-break:break-word}
.search{width:100%;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:15px;outline:none;margin-bottom:10px}
.search:focus{border-color:var(--violet)}
.heat{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--panel2)}
.heat i.l1{background:#3b2a6b}.heat i.l2{background:#5b3fb0}.heat i.l3{background:#8b5cf6}.heat i.l4{background:#22d3ee}
.road{position:relative;padding-left:22px}
.road:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.rm{position:relative;margin-bottom:12px}
.rm:before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--panel2);border:2px solid var(--line2)}
.rm.now:before{background:var(--violet);border-color:var(--violet);box-shadow:0 0 0 4px rgba(139,92,246,.25)}
.rm.past:before{background:var(--emerald);border-color:var(--emerald)}
.rm .rt{font-weight:700;font-size:14px}
.rm .rs{font-size:12px;color:var(--muted);margin-top:2px}
.method{display:flex;gap:12px;margin-bottom:14px}
.method .mi{font-size:24px;flex-shrink:0;width:32px;text-align:center}
.method b{display:block;margin-bottom:2px}
.method p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}

/* ---------- лист (модалка) ---------- */
#shade{position:fixed;inset:0;z-index:70;background:rgba(2,6,23,.72);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s}
#shade.on{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:80;max-height:92vh;overflow-y:auto;
  background:var(--panel);border-top-left-radius:20px;border-top-right-radius:20px;
  border-top:1px solid var(--line2);padding:8px 16px calc(var(--safe-b) + 20px);
  transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
  -webkit-overflow-scrolling:touch;max-width:640px;margin:0 auto;
}
#sheet.on{transform:translateY(0)}
.grip{width:38px;height:4px;border-radius:999px;background:var(--line2);margin:6px auto 12px}
.sheet-title{font-size:17px;font-weight:700;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea,.answer{
  width:100%;padding:12px 13px;border-radius:12px;background:var(--bg);border:1px solid var(--line2);
  color:var(--text);font:inherit;font-size:16px;outline:none;
}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field textarea:focus,.answer:focus{border-color:var(--violet)}
.rule p{margin:0 0 10px;line-height:1.55;font-size:15px}
.rule b{color:#c4b5fd}
.rule i{color:#a5f3fc;font-style:normal}

/* ---------- сцена тренировки ---------- */
#stage{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
#stage.on{display:flex}
.st-head{display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 10px) 14px 10px}
.st-head .progress{flex:1}
.st-title{font-size:12px;color:var(--muted);text-align:center;padding:0 14px 4px;font-weight:600;letter-spacing:.3px}
#stBody{flex:1;overflow-y:auto;padding:12px 16px calc(var(--safe-b) + 24px);max-width:640px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch}
.q-label{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.q-big{font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.15;margin:4px 0 6px;word-break:break-word}
.q-mid{font-size:21px;font-weight:700;line-height:1.3;margin:4px 0 8px;word-break:break-word}
.q-ru{font-size:19px;color:#a5f3fc;font-weight:600}
.q-ex{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px;font-size:15px;line-height:1.45}
.q-ex .ru{color:var(--muted);font-size:14px;margin-top:4px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{padding:14px 14px;border-radius:13px;background:var(--panel);border:1px solid var(--line2);text-align:left;font-size:16px;font-weight:550}
.opt:active{transform:scale(.99)}
.opt.ok{background:rgba(16,185,129,.18);border-color:var(--emerald)}
.opt.bad{background:rgba(239,68,68,.15);border-color:var(--red)}
.opt.pick{border-color:var(--violet);background:rgba(139,92,246,.18)}
.opt.idk{color:var(--dim);font-weight:500;border-style:dashed}
.actions{display:flex;gap:8px;margin-top:18px}
.actions .btn{flex:1}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:18px}
.grades button{padding:12px 4px;border-radius:12px;font-weight:700;font-size:14px;border:1px solid var(--line2);background:var(--panel)}
.grades button small{display:block;font-weight:500;font-size:11px;color:var(--muted);margin-top:2px}
.grades .g0{color:#fca5a5}.grades .g1{color:#fcd34d}.grades .g2{color:#6ee7b7}.grades .g3{color:#67e8f9}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:15px;line-height:1.45}
.fb.ok{background:rgba(16,185,129,.14);border:1px solid rgba(16,185,129,.5)}
.fb.bad{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.45)}
.fb.mid{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.45)}
.speak-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:rgba(139,92,246,.18);color:#c4b5fd;font-size:20px;flex-shrink:0}
.speak-btn:active{transform:scale(.92)}
.play-big{width:96px;height:96px;border-radius:50%;background:var(--violet);color:#fff;font-size:38px;display:flex;align-items:center;justify-content:center;margin:10px auto;box-shadow:0 10px 30px rgba(139,92,246,.35)}
.play-big:active{transform:scale(.95)}
.mic{width:84px;height:84px;border-radius:50%;background:var(--panel2);border:2px solid var(--line2);font-size:34px;display:flex;align-items:center;justify-content:center;margin:12px auto}
.mic.on{background:var(--red);border-color:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}100%{box-shadow:0 0 0 18px rgba(239,68,68,0)}}
.tokens{display:flex;flex-wrap:wrap;gap:7px;min-height:52px;padding:10px;border-radius:13px;background:var(--panel);border:1px dashed var(--line2);margin-top:12px}
.tokens.pool{background:transparent;border:0;padding:4px 0}
.tok{padding:9px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line2);font-size:16px;font-weight:550}
.tok:active{transform:scale(.95)}
.tok.used{opacity:.2;pointer-events:none}
.diff .w{display:inline-block;padding:1px 3px;border-radius:5px;margin:1px}
.diff .w.ok{color:#6ee7b7}
.diff .w.miss{color:#fca5a5;text-decoration:underline wavy;background:rgba(239,68,68,.12)}
.diff .w.extra{color:var(--dim);text-decoration:line-through}
.vgrid{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.vgrid button{padding:10px 13px;border-radius:11px;background:var(--panel);border:1px solid var(--line2);font-size:15px;font-weight:550}
.vgrid button.on{background:rgba(139,92,246,.25);border-color:var(--violet);color:#fff}
.big-emoji{font-size:54px;text-align:center;margin:8px 0}
.result-lvl{font-size:56px;font-weight:900;text-align:center;letter-spacing:-1px;background:linear-gradient(90deg,var(--violet),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;margin:4px 0}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;text-align:center}
.transcript{min-height:60px;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:15px;line-height:1.5;margin-top:10px;white-space:pre-wrap}

/* ---------- читалка ---------- */
.sent{padding:10px 0;border-bottom:1px solid var(--line)}
.sent .en{font-size:17px;line-height:1.6}
.sent .en span{border-radius:4px;padding:0 1px}
.sent .en span:active,.sent .en span.sel{background:rgba(139,92,246,.35)}
.sent .tr{font-size:14px;color:var(--muted);margin-top:4px;display:none}
.sent.show .tr,.reader.showall .sent .tr{display:block}
.sent .tools{display:flex;gap:6px;margin-top:6px}
.sent .tools button{font-size:12px;padding:5px 9px;border-radius:8px;background:var(--panel2);color:var(--muted)}
.sent.playing .en{color:#c4b5fd}
#pop{position:fixed;left:12px;right:12px;bottom:calc(var(--safe-b) + 14px);z-index:65;background:var(--panel2);border:1px solid var(--line2);border-radius:16px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.5);display:none;max-width:616px;margin:0 auto}
#pop.on{display:block}

/* ---------- диалог с ИИ ---------- */
.bub{max-width:86%;padding:10px 12px;border-radius:15px;margin:8px 0;font-size:16px;line-height:1.45;word-break:break-word}
.bub.ai{background:var(--panel2);border-top-left-radius:5px}
.bub.me{background:rgba(139,92,246,.28);margin-left:auto;border-top-right-radius:5px}
.bub.ai .w{border-radius:4px}
.bub.ai .w:active{background:rgba(139,92,246,.4)}
.bub .ru{font-size:14px;color:var(--muted);margin-top:6px;display:none}
.bub.show .ru{display:block}
.bub .tools{display:flex;gap:6px;margin-top:6px}
.bub .tools button{font-size:12px;padding:4px 9px;border-radius:8px;background:rgba(2,6,23,.35);color:var(--muted)}
.bub.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.45);font-size:14px}
.fixbox{max-width:86%;margin:2px 0 8px auto;padding:8px 10px;border-radius:11px;font-size:13px;line-height:1.45;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.4)}
.fixbox.ok{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.4)}
.chat-bar{position:sticky;bottom:calc(-1 * (var(--safe-b) + 24px));background:var(--bg);padding:8px 0 calc(var(--safe-b) + 24px);margin-top:6px}
.chat-row{display:flex;gap:8px;align-items:flex-end}
.chat-row textarea{flex:1;min-width:0;resize:none;max-height:120px}
.tipchip{padding:7px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line2);font-size:13px;text-align:left}
.dots::after{content:"…";animation:dots 1s steps(3) infinite}
@keyframes dots{0%{content:"."}33%{content:".."}66%{content:"..."}}

#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);transform:translateX(-50%) translateY(calc(-100% - 40px));z-index:99;background:var(--panel2);border:1px solid var(--line2);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;transition:transform .25s;max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header id="head">
  <div class="head-row">
    <div>
      <div class="head-title" id="hTitle">Лингво</div>
      <div class="head-sub" id="hSub">английский за полгода</div>
    </div>
    <div class="head-actions" id="hAct"></div>
  </div>
</header>

<main>
  <section class="view on" id="v-today"></section>
  <section class="view" id="v-words"></section>
  <section class="view" id="v-gram"></section>
  <section class="view" id="v-read"></section>
  <section class="view" id="v-chat"></section>
  <section class="view" id="v-prog"></section>
</main>

<nav id="nav">
  <button data-v="today" class="on"><span class="ico">🔥</span>Сегодня</button>
  <button data-v="words"><span class="ico">🧠</span>Слова</button>
  <button data-v="gram"><span class="ico">🧩</span>Грамматика</button>
  <button data-v="read"><span class="ico">🎧</span>Медиа</button>
  <button data-v="chat"><span class="ico">💬</span>Диалог</button>
  <button data-v="prog"><span class="ico">📈</span>Прогресс</button>
</nav>

<div id="stage">
  <div class="st-head">
    <button class="icon-btn" id="stClose" aria-label="Закрыть">✕</button>
    <div class="progress"><i id="stBar" style="width:0"></i></div>
    <span class="small dim" id="stCount"></span>
  </div>

      topic = tp || "";

    else { c.ivl = c.reps === 0 ? 3 : Math.round(Math.max(c.ivl, 1) * c.ease * 1.3) + 1; c.ease += 0.15; }
    c.reps++;

/* ============================================================
   Проверка ответов
   ============================================================ */
const CONTR = { "i'm": "i am", "you're": "you are", "we're": "we are", "they're": "they are", "isn't": "is not", "aren't": "are not",
  "wasn't": "was not", "weren't": "were not", "don't": "do not", "doesn't": "does not", "didn't": "did not", "can't": "can not",
  "cannot": "can not", "won't": "will not", "wouldn't": "would not", "shouldn't": "should not", "couldn't": "could not",
  "mustn't": "must not", "haven't": "have not", "hasn't": "has not", "hadn't": "had not", "let's": "let us",
  "i'll": "i will", "you'll": "you will", "he'll": "he will", "she'll": "she will", "it'll": "it will", "we'll": "we will", "they'll": "they will",
  "i've": "i have", "you've": "you have", "we've": "we have", "they've": "they have", "what's": "what is", "that's": "that is",
  "there's": "there is", "where's": "where is", "who's": "who is", "how's": "how is", "it's": "it is", "gonna": "going to", "wanna": "want to" };
function norm(s, alt) {
  let t = " " + String(s).toLowerCase().replace(/[’`]/g, "'").replace(/[—–-]/g, " ").replace(/[^a-z0-9' ]+/g, " ") + " ";
  t = t.replace(/\s+/g, " ");
  t = t.split(" ").map(w => {
    if (CONTR[w]) return CONTR[w];
    if (/^(he|she|it)'s$/.test(w)) return w.slice(0, -2) + (alt ? " has" : " is");
    if (/^\w+'d$/.test(w)) return w.slice(0, -2) + (alt ? " had" : " would");
    return w;
  }).join(" ");
  t = t.replace(/'s\b/g, "s").replace(/'/g, "");
  t = t.replace(/\b(\w{2,})our\b/g, "$1or").replace(/\b(\w{3,})is(e|ed|es|ing)\b/g, "$1iz$2").replace(/\bok(ay)?\b/g, "ok");
  return t.replace(/\s+/g, " ").trim();
}
function lev(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length; if (!m || !n) return m || n;
  let p = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const c = [i];
    for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    p = c;
  }
  return p[n];
}
/* 2 — точно, 1 — с опечаткой, 0 — неверно */
function check(user, target) {
  const targets = String(target).split(" / ");
  let best = 0;
  for (const tg of targets) for (const ta of [0, 1]) for (const ua of [0, 1]) {
    let u = norm(user, ua), t = norm(tg, ta);
    const tNoTo = t.replace(/^to /, ""); u = u.replace(/^to /, "");
    if (!u) continue;
    if (u === t || u === tNoTo) return 2;
    if (lev(u, tNoTo) <= Math.max(1, Math.floor(tNoTo.length / 8))) best = 1;
  }
  return best;
}
/* Пословное сравнение (LCS) для диктанта и шэдоуинга.
   Здесь сокращения не раскрываем: «I'm» в тексте сравнивается с «I'm» в ответе. */
const ONES = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
const TENS = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
const numWord = n => n < 20 ? ONES[n] : n < 100 ? TENS[Math.floor(n / 10)] + (n % 10 ? " " + ONES[n % 10] : "") : String(n);
const lightNorm = w => w.toLowerCase().replace(/[’`]/g, "'").replace(/[^a-z0-9']/g, "").replace(/^'+|'+$/g, "");
const sameWord = (a, b) => a === b || (a.length > 4 && lev(a, b) <= 1);
function wordDiff(user, target) {
  const tw = target.split(/\s+/).filter(Boolean), tn = tw.map(lightNorm);
  const u = String(user).replace(/%/g, " percent").replace(/\b\d{1,2}\b/g, m => numWord(+m));
  const un = u.split(/[\s—–-]+/).map(lightNorm).filter(Boolean);
  const m = tn.length, n = un.length, L = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--)
    L[i][j] = tn[i] && sameWord(tn[i], un[j]) ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const marks = new Array(m).fill(false); let i = 0, j = 0;
  while (i < m && j < n) {
    if (tn[i] && sameWord(tn[i], un[j])) { marks[i] = true; i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++;
  }
  const real = tn.filter(Boolean).length || 1;
  const hit = marks.filter((x, k) => x && tn[k]).length;
  const html = tw.map((w, k) => `<span class="w ${!tn[k] || marks[k] ? "ok" : "miss"}">${esc(w)}</span>`).join(" ");
  return { score: hit / real, html };
}

const TTS = window.speechSynthesis;

}

}

}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const SR_ERR = {

  "service-not-allowed": "Распознавание речи выключено. На iPhone: Настройки → Основные → Клавиатура → включи «Диктовка», и Настройки → Siri — включи Siri.",
  "audio-capture": "Микрофон недоступен — возможно, его занимает другое приложение.",

const SR_FATAL = ["not-allowed", "service-not-allowed", "audio-capture", "start-failed"];
const srOn = () => !!SR && !S.set.srOff;
/* Распознавание речи. onText(текст) — по ходу речи, onEnd(текст, ошибка) — в конце.
   Текст собираем из всех результатов, включая промежуточные: Safari на iPhone
   часто так и не помечает их финальными, и без этого ответ терялся. */
function listen(onText, onEnd, continuous, maxMs) {
  if (!SR) return null;
  let r;

  r.lang = "en-US"; r.interimResults = true; r.continuous = !!continuous; r.maxAlternatives = 1;
  let text = "", err = null, ended = false;

  };

/* Запись своего голоса — работает и там, где нет распознавания речи. */
const canRecord = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
async function startRecording() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const type = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
  const mr = new MediaRecorder(stream, type ? { mimeType: type } : undefined), chunks = [];
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };

const wait = ms => new Promise(r => setTimeout(r, ms));
let AC;
function beep(ok) {

    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;

/* Найти слово в его примере: точное совпадение или форма (arrive → arrived). */
function clozeOf(w) {
  if (!w || !w.ex || w.kind === "ch") return null;
  const ex = w.ex, en = w.en.replace(/[?.!…]+$/, "").trim(), low = en.toLowerCase();
  if (/\s/.test(en)) {
    const i = ex.toLowerCase().indexOf(low);
    return i < 0 ? null : { before: ex.slice(0, i), ans: ex.slice(i, i + en.length), after: ex.slice(i + en.length) };
  }
  const re = /[A-Za-z']+/g; let m;
  while ((m = re.exec(ex))) {
    const tk = m[0].toLowerCase();
    if (tk === low || (low.length >= 4 && tk.startsWith(low.slice(0, -1)) && tk.length - low.length <= 3))
      return { before: ex.slice(0, m.index), ans: m[0], after: ex.slice(m.index + m[0].length) };
  }
  return null;
}
T.cloze = (t, el) => {
  const w = t.w, cz = clozeOf(w);
  if (!cz) { t.type = "recallRu"; return T.recallRu(t, el); }
  const hint = cz.ans[0] + "_".repeat(Math.max(2, cz.ans.length - 1));
  el.innerHTML = `
    <div class="q-label">Вставь слово во фразу</div>
    <div class="q-mid" style="line-height:1.5">${esc(cz.before)}<span style="color:var(--cyan);letter-spacing:2px">${esc(hint)}</span>${esc(cz.after)}</div>

    <p class="small dim">Подсказка: ${esc(w.ru)}</p>
    <input class="answer" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="пропущенное слово…">
    <div class="actions"><button class="btn" id="idk">Не помню</button><button class="btn primary" id="chk">Проверить</button></div>
    <div id="fbx"></div>`;
  const inp = $("#ans", el); setTimeout(() => inp.focus(), 60);
  let done = false;
  const finish = v => {
    if (done) return; done = true;
    let r = v ? check(v, cz.ans) : 0, note = "";
    if (r < 2 && v && check(v, w.en) === 2 && cz.ans.toLowerCase() !== w.en.toLowerCase()) { r = 1; note = ` Здесь нужна форма «${cz.ans}».`; }
    beep(r > 0); speak(w.ex);
    feedback($("#fbx", el), r === 2 ? "ok" : r === 1 ? "mid" : "bad",
      `<div class="row" style="align-items:flex-start"><div style="flex:1"><b>${r === 2 ? esc(coach("right")) : r === 1 ? "Почти." + esc(note) : esc(coach("wrong"))}</b><br>${esc(cz.before)}<b style="color:#a5f3fc">${esc(cz.ans)}</b>${esc(cz.after)}</div>${speakBtn(w.ex)}</div>`);
    const q = r === 2 ? 2 : r === 1 ? 1 : 0;
    $(".actions", el).innerHTML = (q ? "" : `<button class="btn" id="typo">Я знал, опечатка</button>`) + `<button class="btn primary" id="nx">Дальше</button>`;
    $("#nx", el).onclick = () => { reviewGrade(w, q); next(q > 0); };
    if ($("#typo", el)) $("#typo", el).onclick = () => { reviewGrade(w, 1); next(true); };
    setTimeout(() => $("#nx", el) && $("#nx", el).focus(), 50);
  };
  $("#chk", el).onclick = () => { if (inp.value.trim()) finish(inp.value); };
  $("#idk", el).onclick = () => finish("");
  inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); done ? $("#nx", el).click() : $("#chk", el).click(); } };
};

/* Проверка выученных слов: в любой момент, без самооценки — ответ
   проверяет приложение. Расписание повторений не меняется; слова с ошибкой
   в конце можно одной кнопкой вернуть в повторение. */
T.verify = (t, el) => {
  const w = t.w, c = ST.ctx, cz = clozeOf(w);
  const mode = t.mode || (t.mode = cz && Math.random() < 0.4 ? "cloze" : Math.random() < 0.5 ? "type" : "pick");
  const done = ok => {
    if (!ok) c.wrong.push(w);
    setTimeout(() => next(ok), ok ? 450 : 0);
  };
  if (mode === "pick") {
    const pool = shuffle([...WORDS, ...S.own].filter(x => x.id !== w.id && x.ru !== w.ru && x.kind === w.kind));
    const opts = shuffle([w, ...pool.slice(0, 3)]);
    el.innerHTML = `<div class="q-label">Проверка · что это значит?</div>
      <div class="row"><div class="q-big" style="flex:1">${esc(w.en)}</div>${speakBtn(w.en)}</div>
      <div class="opts">${opts.map(o => `<button class="opt" data-id="${esc(o.id)}">${esc(o.ru)}</button>`).join("")}<button class="opt idk" data-id="">Не знаю</button></div>`;
    $$(".opt", el).forEach(b => b.onclick = () => {
      const ok = b.dataset.id === w.id;
      $$(".opt", el).forEach(x => { x.disabled = true; if (x.dataset.id === w.id) x.classList.add("ok"); });
      if (!ok && b.dataset.id) b.classList.add("bad");
      beep(ok); if (!ok) { speak(w.en); setTimeout(() => done(false), 1300); } else done(true);
    });
    return;
  }
  const isCz = mode === "cloze" && cz;
  const target = isCz ? cz.ans : w.en;
  el.innerHTML = `<div class="q-label">Проверка · ${isCz ? "вставь слово во фразу" : "напиши по-английски"}</div>
    ${isCz ? `<div class="q-mid" style="line-height:1.5">${esc(cz.before)}<span style="color:var(--cyan);letter-spacing:2px">${esc(cz.ans[0] + "_".repeat(Math.max(2, cz.ans.length - 1)))}</span>${esc(cz.after)}</div><p class="small muted">${esc(w.exr || "")}</p>`
           : `<div class="q-mid">${esc(w.ru)}</div>${w.exr ? `<p class="small muted">Ситуация: ${esc(w.exr)}</p>` : ""}`}
    <input class="answer" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ответ…">
    <div class="actions"><button class="btn" id="idk">Не помню</button><button class="btn primary" id="chk">Проверить</button></div><div id="fbx"></div>`;
  const inp = $("#ans", el); setTimeout(() => inp.focus(), 60);
  let answered = false;
  const finish = v => {
    if (answered) return; answered = true;
    let r = v ? check(v, target) : 0;
    if (r < 2 && v && isCz && check(v, w.en) === 2) r = 1;
    const ok = r > 0;
    beep(ok); speak(isCz ? w.ex : w.en);
    feedback($("#fbx", el), r === 2 ? "ok" : r === 1 ? "mid" : "bad",
      `<b>${r === 2 ? esc(coach("right")) : r === 1 ? "Почти — засчитано." : esc(coach("wrong"))}</b><br>${isCz ? `${esc(cz.before)}<b style="color:#a5f3fc">${esc(cz.ans)}</b>${esc(cz.after)}` : `<b style="color:#a5f3fc">${esc(w.en)}</b> — ${esc(w.ru)}`}`);
    $(".actions", el).innerHTML = (ok ? "" : `<button class="btn" id="typo">Я знал, опечатка</button>`) + `<button class="btn primary" id="nx">Дальше</button>`;
    $("#nx", el).onclick = () => done(ok);
    if ($("#typo", el)) $("#typo", el).onclick = () => done(true);
    setTimeout(() => $("#nx", el) && $("#nx", el).focus(), 50);
  };
  $("#chk", el).onclick = () => { if (inp.value.trim()) finish(inp.value); };
  $("#idk", el).onclick = () => finish("");
  inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); answered ? $("#nx", el).click() : $("#chk", el).click(); } };
};
let VERIFY_N = 20;
function verifySets() {
  const ids = Object.keys(S.cards).filter(id => itemById(id));
  const t = today();
  return {
    known: ids.filter(id => isKnown(S.cards[id])),
    marked: ids.filter(id => { const c = S.cards[id]; return isKnown(c) && !c.last; }),
    studied: ids.filter(id => S.cards[id].last && S.cards[id].due > t),
    all: ids
  };
}
function verifySheet() {
  const v = verifySets();
  const row = (k, e, name, sub, n) => `<button class="li" data-vk="${k}" ${n ? "" : "disabled style=\"opacity:.45\""}><span style="font-size:20px">${e}</span><div class="lb"><div class="lt">${name} · ${n}</div><div class="ls">${sub}</div></div><span class="dim">›</span></button>`;
  openSheet(`<div class="sheet-title">✅ Проверить выученные</div>
    <p class="small muted" style="margin-top:-6px">Проверка в любой момент, не дожидаясь повторения. Отвечаешь сам — приложение проверяет. Расписание повторений не меняется; слова, где ошибся, в конце можно вернуть в повторение.</p>
    <div class="field"><label>Сколько слов</label><div class="seg" id="vN">${[20, 50, 100, 0].map(n => `<button data-n="${n}" class="${VERIFY_N === n ? "on" : ""}">${n || "Все"}</button>`).join("")}</div></div>
    ${row("known", "🏆", "Выученные", "интервал повторения 3 недели и больше", v.known.length)}
    ${row("marked", "🙋", "Отмеченные «Уже знаю»", "проверить, правда ли знаешь", v.marked.length)}
    ${row("studied", "🧠", "Повторённые, срок ещё не подошёл", "проверить заранее", v.studied.length)}
    ${row("all", "📚", "Вся колода", "все слова, которые ты учишь", v.all.length)}`);
  $$("#vN button").forEach(b => b.onclick = () => { VERIFY_N = +b.dataset.n; $$("#vN button").forEach(x => x.classList.toggle("on", x === b)); });
  $$("[data-vk]").forEach(b => b.onclick = () => {

/* ---------- заучивание трудных слов ----------
   Отдельная тренировка, расписание повторений не меняет. Каждое слово нужно
   пройти 3 раза правильно по ступеням (узнать → выбрать английское / вставить
   во фразу → написать), между ступенями слово уходит на 3–6 карточек назад;
   ошибка возвращает его на первую ступень. */
function weakWords() {
  const out = [], seen = new Set(), m = S.mara || {};
  const add = w => { if (w && !seen.has(w.id)) { seen.add(w.id); out.push(w); } };
  Object.keys(S.cards).filter(id => S.cards[id].lapses > 0 && !isKnown(S.cards[id]))
    .sort((a, b) => S.cards[b].lapses - S.cards[a].lapses).forEach(id => add(itemById(id)));
  Object.keys(m).filter(id => m[id] === 0).forEach(id => add(itemById(id)));
  return out;
}
function learningWords() {
  const weak = new Set(weakWords().map(w => w.id));
  return Object.keys(S.cards).filter(id => !isKnown(S.cards[id]) && !weak.has(id) && itemById(id))
    .sort((a, b) => S.cards[a].ease - S.cards[b].ease || S.cards[a].ivl - S.cards[b].ivl).map(itemById);
}
let DRILL_N = 7;
function drillSheet() {

    <div class="field"><label>Слов в пачке</label><div class="seg" id="dN">${[5, 7, 10].map(n => `<button data-n="${n}" class="${DRILL_N === n ? "on" : ""}">${n}</button>`).join("")}</div></div>
    ${row("weak", "🔥", "Трудные", "забытые в повторении и ошибки марафона", weak.length)}
    ${row("learn", "🧠", "В обучении", "ещё не выученные, сначала самые трудные", learn.length)}
    ${row("all", "📚", "Всё вместе", "сначала трудные, потом в обучении", weak.length + learn.length)}

  $$("#dN button").forEach(b => b.onclick = () => { DRILL_N = +b.dataset.n; $$("#dN button").forEach(x => x.classList.toggle("on", x === b)); });
  const sets = { weak, learn, all: [...weak, ...learn] };
  $$("[data-dk]").forEach(b => b.onclick = () => { const l = sets[b.dataset.dk]; if (!l.length) return; closeSheet(); startDrill(l.slice(0, DRILL_N), l.slice(DRILL_N)); });
  $("#dListen").onclick = () => { closeSheet(); startListenLoop([...weak, ...learn].slice(0, 40)); };
}
function startDrill(batch, rest) {
  const ctx = { mastered: 0, total: batch.length, miss: {}, rest };
  const tasks = batch.map(w => ({ type: "dIntro", w }));
  shuffle(batch).forEach(w => tasks.push({ type: "drill", w, step: 0 }));
  runStage("Заучивание", tasks, r => {
    const hard = batch.filter(w => (ctx.miss[w.id] || 0) >= 2);
    return {
      html: `<div class="grid2" style="margin-top:12px"><div class="stat"><b>${ctx.mastered}/${ctx.total}</b><span>закреплено</span></div><div class="stat"><b>${Object.values(ctx.miss).reduce((a, b) => a + b, 0)}</b><span>ошибок по пути</span></div></div>
        ${hard.length ? `<div class="card" style="margin-top:12px"><div class="small muted" style="margin-bottom:6px">Самые упрямые — придумай к ним подсказку (💡 в слове):</div>${hard.map(w => `<div class="row" style="padding:4px 0;border-bottom:1px solid var(--line)"><b style="flex:1">${esc(w.en)}</b><span class="muted small">${esc(w.ru)}</span></div>`).join("")}</div>` : ""}
        ${rest.length ? `<button class="btn primary wide" id="dMore" style="margin-top:12px">🔥 Следующие ${Math.min(DRILL_N, rest.length)} слов</button>` : ""}
        <button class="btn wide" id="dAgain" style="margin-top:8px">🔁 Эту пачку ещё раз</button>`,
      bind: () => {
        if ($("#dMore")) $("#dMore").onclick = () => startDrill(rest.slice(0, DRILL_N), rest.slice(DRILL_N));
        $("#dAgain").onclick = () => startDrill(batch, rest);
      }
    };
  }, { ctx });
}

/* одна ступень заучивания */
T.drill = (t, el) => {
  const w = t.w, c = ST.ctx, step = t.step, cz = clozeOf(w);
  const dots = [0, 1, 2].map(i => `<span style="color:${i < step ? "var(--emerald)" : "var(--line2)"}">●</span>`).join(" ");
  const label = `Заучивание · ${dots} · закреплено ${c.mastered}/${c.total}`;
  const result = ok => {
    if (ok) {
      if (step + 1 >= 3) { c.mastered++; S.drill = S.drill || {}; const d = S.drill[w.id] || { n: 0 }; d.n++; d.last = today(); S.drill[w.id] = d; }
      else ST.tasks.splice(Math.min(ST.tasks.length, ST.i + 1 + (step === 0 ? 3 : 6)), 0, { type: "drill", w, step: step + 1 });
    } else {
      c.miss[w.id] = (c.miss[w.id] || 0) + 1;
      const at = Math.min(ST.tasks.length, ST.i + 1);
      const back = [{ type: "drill", w, step: 0 }];
      if (c.miss[w.id] % 2 === 0) back.unshift({ type: "dIntro", w, again: true });
      ST.tasks.splice(Math.min(ST.tasks.length, at + 2), 0, ...back);
    }
    save(); next(ok);
  };
  if (step === 0 || (step === 1 && !(cz && Math.random() < 0.5))) {
    const toEn = step === 1;
    const pool = shuffle([...WORDS, ...S.own].filter(x => x.id !== w.id && x.ru !== w.ru && x.en !== w.en && x.kind === w.kind));
    const opts = shuffle([w, ...pool.slice(0, 3)]);
    el.innerHTML = `<div class="q-label">${label}</div>
      <div class="q-mid" style="font-size:24px">${esc(toEn ? w.ru : w.en)}</div>${toEn ? "" : speakBtn(w.en)}
      <div class="opts">${opts.map(o => `<button class="opt" data-id="${esc(o.id)}">${esc(toEn ? o.en : o.ru)}</button>`).join("")}<button class="opt idk" data-id="">Не помню</button></div><div id="fbx"></div>`;
    if (!toEn) speak(w.en);
    $$(".opt", el).forEach(b => b.onclick = () => {
      const ok = b.dataset.id === w.id;
      $$(".opt", el).forEach(x => { x.disabled = true; if (x.dataset.id === w.id) x.classList.add("ok"); });
      if (!ok && b.dataset.id) b.classList.add("bad");
      beep(ok); if (toEn || !ok) speak(w.en);
      if (!ok && S.notes && S.notes[w.id]) feedback($("#fbx", el), "mid", "💡 " + esc(S.notes[w.id]));
      setTimeout(() => result(ok), ok ? 450 : 1600);
    });
    return;
  }
  const isCz = step === 1;
  const target = isCz ? cz.ans : w.en;
  el.innerHTML = `<div class="q-label">${label}</div>
    ${isCz ? `<div class="q-mid" style="line-height:1.5">${esc(cz.before)}<span style="color:var(--cyan);letter-spacing:2px">${esc(cz.ans[0] + "_".repeat(Math.max(2, cz.ans.length - 1)))}</span>${esc(cz.after)}</div><p class="small muted">${esc(w.exr || "")}</p>`
           : `<div class="q-mid" style="font-size:24px">${esc(w.ru)}</div><p class="small muted">Напиши по-английски${w.exr ? ` · ${esc(w.exr)}` : ""}</p>`}
    <input class="answer" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ответ…">
    <div class="actions"><button class="btn" id="idk">Не помню</button><button class="btn primary" id="chk">Проверить</button></div><div id="fbx"></div>`;
  const inp = $("#ans", el); setTimeout(() => inp.focus(), 60);
  let answered = false;
  const finish = v => {
    if (answered) return; answered = true;
    let r = v ? check(v, target) : 0;
    if (r < 2 && v && isCz && check(v, w.en) === 2) r = 1;
    const ok = r > 0, note = S.notes && S.notes[w.id];
    beep(ok); speak(isCz ? w.ex : w.en);
    feedback($("#fbx", el), r === 2 ? "ok" : r === 1 ? "mid" : "bad",
      `<b>${r === 2 ? esc(coach("right")) : r === 1 ? "Почти — засчитано." : esc(coach("wrong"))}</b><br>${isCz ? `${esc(cz.before)}<b style="color:#a5f3fc">${esc(cz.ans)}</b>${esc(cz.after)}` : `<b style="color:#a5f3fc">${esc(w.en)}</b> — ${esc(w.ru)}`}${!ok && note ? `<br>💡 ${esc(note)}` : ""}`);
    $(".actions", el).innerHTML = (ok ? "" : `<button class="btn" id="typo">Я знал, опечатка</button>`) + `<button class="btn primary" id="nx">Дальше</button>`;
    $("#nx", el).onclick = () => result(ok);
    if ($("#typo", el)) $("#typo", el).onclick = () => result(true);
    setTimeout(() => $("#nx", el) && $("#nx", el).focus(), 50);
  };
  $("#chk", el).onclick = () => { if (inp.value.trim()) finish(inp.value); };
  $("#idk", el).onclick = () => finish("");
  inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); answered ? $("#nx", el).click() : $("#chk", el).click(); } };
};

T.listenLoop = (t, el) => {
  const ws = t.words; let i = 0, playing = true, loops = 0, run = 0;
  el.innerHTML = `<div class="q-label" id="llCount"></div>
    <div class="card" style="text-align:center;padding:26px 14px">

  };
  const pause = ms => new Promise(r => setTimeout(r, ms));
  const loop = async () => {
    const my = ++run;
    while (playing && ST.on && my === run && $("#llEn", el)) {
      show(); const w = ws[i];
      await speak(w.en); if (!playing || my !== run) break; await pause(700);
      await speakRu(w.ru); if (!playing || my !== run) break; await pause(500);

    }
  };
  const setPlay = p => { playing = p; $("#llPlay", el).textContent = p ? "⏸" : "▶"; if (!p && TTS) TTS.cancel(); else loop(); };
  $("#llPlay", el).onclick = () => setPlay(!playing);

/* ============================================================
   План дня
   ============================================================ */
const STEP_META = {
  review: { ico: "🧠", name: "Повторение", why: "интервальные повторения" },
  new:    { ico: "✨", name: "Новые слова", why: "частотные слова и фразы" },
  grammar:{ ico: "🧩", name: "Грамматика", why: "одна тема за раз" },
  listen: { ico: "✍️", name: "Диктант", why: "понимание на слух" },
  shadow: { ico: "🗣", name: "Шэдоуинг", why: "произношение и беглость" },
  speak:  { ico: "💬", name: "Говорение", why: "свободная речь" }
};
const STEPS = Object.keys(STEP_META);
const P = () => S.profile || { level: "A0", minutes: 45, plan: 6, newPerDay: 12, input: 30, start: today() };
function stepsForToday() {
  const m = P().minutes;
  if (m <= 30) return ["review", "new", "grammar", "listen"];
  if (m <= 45) return ["review", "new", "grammar", "listen", "shadow"];
  return STEPS;
}
function stepInfo(k) {
  const d = D();
  if (k === "review") { const n = dueIds().length; return { sub: n ? `${n} ${plural(n, "карточка", "карточки", "карточек")} к повторению` : "на сегодня всё повторено", auto: !n }; }
  if (k === "new") { const left = Math.max(0, P().newPerDay - d.nw); return { sub: left ? `${left} ${plural(left, "новое слово", "новых слова", "новых слов")}` : "дневная норма взята", auto: !left || !newQueue().length }; }
  if (k === "grammar") { const g = currentTopic(); return { sub: g ? g.title : "все темы пройдены — повторение", auto: false }; }
  if (k === "listen") return { sub: "5 фраз на слух" };
  if (k === "shadow") return { sub: "3 фразы вслух за диктором" };
  if (k === "speak") { const p = speakPrompt(); return { sub: p[0] }; }
  return { sub: "" };
}
const stepDone = k => !!D().steps[k] || !!stepInfo(k).auto;
const nextUndone = () => stepsForToday().find(k => !stepDone(k));

function currentTopic() {
  const start = clamp(lvIdx(P().level), 1, 4);
  return GRAMMAR.find(g => lvIdx(g.lvl) >= start && !(S.gram[g.id] && S.gram[g.id].done))
      || GRAMMAR.find(g => !(S.gram[g.id] && S.gram[g.id].done)) || null;
}
function speakPrompt() {
  const L = LV[clamp(lvIdx(P().level), 1, 4)];
  const list = SPEAK[L]; return list[(S.speakN || 0) % list.length];
}
function sentencePool(lvlIdx) {
  const out = [];
  for (const tx of TEXTS) {
    const d = lvIdx(tx.lvl) - lvlIdx;
    if (d < -1 || d > 1) continue;
    for (const [en, ru] of tx.pairs) out.push({ en: en.replace(/^—\s*/, ""), ru: ru.replace(/^—\s*/, "") });
  }
  for (const id of Object.keys(S.cards)) { const w = itemById(id); if (w && w.ex && w.ex.split(" ").length >= 4) out.push({ en: w.ex, ru: w.exr }); }
  return out;
}

function startStep(k, chain) {
  const lvl = clamp(lvIdx(P().level), 1, 4);
  const done = () => { D().steps[k] = true; save(); };
  if (k === "review") {
    const ids = dueIds().slice(0, 120);
    if (!ids.length) { done(); toast("Повторять нечего — всё по графику"); return chain ? (nextUndone() ? startStep(nextUndone(), true) : closeStage()) : render(); }
    const tasks = shuffle(ids).map(id => {
      const w = itemById(id), c = S.cards[id], r = Math.random();
      // доп. режимы идут вперемешку со старыми; без них — прежнее поведение
      if (S.set.newModes !== false) {
        if (c.reps >= 1 && r < 0.25 && clozeOf(w)) return { type: "cloze", w, review: true };
        if (r < 0.5) return { type: "recallRu", w, review: true };
      }
      return { type: c.reps >= 2 && Math.random() < 0.55 ? "type" : "recall", w, review: true };
    });
    runStage("Повторение", tasks, () => { done(); }, { chain, step: k });
  } else if (k === "new") {
    const left = Math.max(1, P().newPerDay - D().nw);
    const ws = newQueue().slice(0, Math.min(left, 25));
    if (!ws.length) { done(); toast("Новые слова закончились — добавь свои во вкладке «Слова»"); return render(); }
    const tasks = [];
    for (let i = 0; i < ws.length; i += 5) {
      const b = ws.slice(i, i + 5);
      b.forEach(w => tasks.push({ type: "intro", w }));
      shuffle(b).forEach(w => tasks.push({ type: "pick", w }));
      shuffle(b).forEach(w => tasks.push({ type: "type", w }));
    }
    runStage("Новые слова", tasks, () => { if (D().nw >= P().newPerDay || !newQueue().length) done(); }, { chain, step: k });
  } else if (k === "grammar") {
    const g = currentTopic() || rnd(GRAMMAR);
    startGrammar(g, chain, true);
  } else if (k === "listen") {
    const pool = shuffle(sentencePool(lvl)).slice(0, 5);
    runStage("Диктант", pool.map(s => ({ type: "dict", s })), () => { done(); }, { chain, step: k });
  } else if (k === "shadow") {
    const pool = shuffle(sentencePool(lvl).filter(s => s.en.split(" ").length <= 16)).slice(0, 3);
    runStage("Шэдоуинг", pool.map(s => ({ type: "shadow", s })), () => { done(); }, { chain, step: k });
  } else if (k === "speak") {
    runStage("Говорение", [{ type: "speak", p: speakPrompt() }], () => { done(); }, { chain, step: k });
  }
}
function startGrammar(g, chain, asStep) {
  const st = S.gram[g.id] || {};
  const tasks = [];
  if (!st.runs) tasks.push({ type: "rule", g });
  const typed = lvIdx(g.lvl) >= 3 || lvIdx(P().level) >= 3;
  const mcs = shuffle(g.mc).map(item => ({ type: "mc", item, g }));
  const trs = shuffle(g.tr).map(item => ({ type: "build", item, g, typed }));
  tasks.push(mcs[0], trs[0], mcs[1], trs[1], trs[2], mcs[2], trs[3], mcs[3], trs[4], trs[5]);
  // перемешивание со старыми темами
  const old = GRAMMAR.filter(x => x.id !== g.id && S.gram[x.id] && S.gram[x.id].runs);
  shuffle(old).slice(0, 2).forEach(o => tasks.push({ type: "mc", item: rnd(o.mc), g: o, label: "Повтор старой темы" }));
  runStage("Грамматика", tasks.filter(Boolean), r => {
    const pct = Math.round(r.ok / Math.max(1, r.ok + r.bad) * 100);
    const s = S.gram[g.id] = S.gram[g.id] || { runs: 0, best: 0 };
    s.runs++; s.best = Math.max(s.best, pct); s.last = today();
    if (pct >= 80) s.done = true;
    if (asStep) D().steps.grammar = true;
    save();
    return { html: `<div class="card" style="margin-top:12px"><b>${esc(g.title)}</b><div class="small muted" style="margin-top:4px">${s.done ? "✅ Тема освоена. Завтра — следующая." : "Нужно 80%, чтобы тема засчиталась. Завтра повторим её ещё раз — так и должно быть."}</div></div>` };
  }, { chain, step: asStep ? "grammar" : null });
}

function gPool(li) { return li >= 5 ? C1_TEST : GRAMMAR.filter(g => lvIdx(g.lvl) === li).flatMap(g => g.mc); }
function pushGrammarBlock() {
  const c = ST.ctx; c.block = [];
  shuffle(gPool(c.gl)).slice(0, 4).forEach(item => ST.tasks.push({ type: "mc", item, idk: true, silent: true, label: `Часть 2 из 3 · Грамматика · ${LV[c.gl]}`, onAnswer: ok => gAnswer(ok) }));
}
function gAnswer(ok) {
  const c = ST.ctx; c.block.push(ok);
  if (c.block.length < 4) return;
  const right = c.block.filter(Boolean).length;
  if (right >= 3) { c.passed = c.gl; c.gl++; if (c.gl <= 5) return pushGrammarBlock(); }
  // грамматика закончилась → аудирование
  const top = Math.min(4, c.passed + 1);
  LISTEN_TEST.filter(x => lvIdx(x.lvl) <= top).forEach(x => ST.tasks.push({ type: "dict", s: { en: x.text, ru: "" }, silent: true, label: `Часть 3 из 3 · ${x.lvl}`, onScore: sc => c.lis.push({ l: lvIdx(x.lvl), sc }) }));
  ST.tasks.push({ type: "tResult" });
}
function vocabLevel(v) { return v < 300 ? 0 : v < 1000 ? 1 : v < 2000 ? 2 : v < 3500 ? 3 : v < 6000 ? 4 : 5; }
T.tResult = (t, el) => {
  const c = ST.ctx;
  let level, g = 0, vl = 0, ll = 0;
  if (c.zero) { level = 0; c.vocab = 0; }
  else {
    g = c.passed; vl = vocabLevel(c.vocab || 0);
    ll = 0; for (const x of c.lis.sort((a, b) => a.l - b.l)) { if (x.sc >= 0.7) ll = x.l; else break; }
    if (!c.lis.length) ll = g;

function levelByHours(h) { let l = "A0"; for (const k of LV) if (LEVELS[k].hours <= h) l = k; return l; }
function project(L, plan) {
  const base = LEVELS[L].hours, perDay = (plan.minutes + plan.input) / 60;
  const months = [];
  for (let m = 1; m <= plan.plan; m++) { const h = base + perDay * 30.4 * m; months.push({ m, h, l: levelByHours(h) }); }
  return { base, perDay, end: months[months.length - 1], months };
}
function projectionHtml(L, plan) {
  const p = project(L, plan), endL = p.end.l, total = Math.round(p.perDay * 30.4 * plan.plan);
  const nextTarget = LV[Math.min(5, lvIdx(endL) + 1)];
  const needH = LEVELS[nextTarget].hours - p.base, needMin = Math.ceil(needH / (30.4 * plan.plan) * 60 / 5) * 5;
  return `<div class="small muted">Прогноз</div>
    <div style="font-size:18px;font-weight:800;margin:4px 0">${L} → <span style="color:#67e8f9">${endL}</span> за ${plan.plan} мес</div>
    <div class="small muted" style="line-height:1.55">${plan.minutes} мин в приложении + ${plan.input} мин погружения = ${Math.round(p.perDay * 60)} мин в день, ~${total} часов за срок.
    ${endL !== "C1" ? `<br>Хочешь <b style="color:var(--text)">${nextTarget}</b> за этот срок — нужно ~${needMin} мин в день суммарно.` : ""}</div>

}

T.mara = (t, el) => {

function aiSystem(sc) {

Your role: ${role}.

- Write the reply in English only, 1-3 short sentences, using words and grammar the learner can understand at their level. For A1 use very simple words and short sentences.
- Stay in your role and keep the conversation going: end with a question or something the learner can answer.

###RU

###FIX

      $$(".w", ai).forEach(sp => sp.onclick = () => {
        const w = lookup(sp.textContent);
        speak(sp.textContent.replace(/[^A-Za-z']/g, ""));
        toast(w ? `${w.en} — ${w.ru}` : "Нет в словаре — нажми «перевод»");
      });
      if (meBubble) {
        const fb = document.createElement("div");
        fb.className = "fixbox" + (r.fix.length ? "" : " ok");
        fb.innerHTML = r.fix.length ? r.fix.map(x => "✏️ " + esc(x)).join("<br>") : "✅ Без ошибок";
        meBubble.after(fb);
        c.fixes.push(...r.fix);
      }
      setTips(r.tips);
      scrollDown();
      if (c.autoSpeak && r.reply) speak(r.reply);
    } catch (e) {
      if (!ST.on) return;
      c.api.pop(); // запрос не прошёл — убираем реплику, чтобы её можно было отправить снова
      if (userText) { c.userN--; inp.value = userText; if (meBubble) meBubble.remove(); }
      ai.className = "bub err"; ai.textContent = errText(e);
      if (!userText) { const rb = document.createElement("button"); rb.className = "btn sm"; rb.style.marginTop = "8px"; rb.textContent = "Попробовать снова"; rb.onclick = () => { ai.remove(); turn(null); }; ai.appendChild(document.createElement("br")); ai.appendChild(rb); }
    } finally {
      c.busy = false; if ($("#chSend")) $("#chSend").disabled = false;
    }
  }
  const send = () => { const v = inp.value.trim(); if (!v || c.busy) return; inp.value = ""; turn(v); };
  $("#chSend").onclick = send;
  inp.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
  $("#chSpk").onclick = () => { c.autoSpeak = !c.autoSpeak; S.set.chatSpeak = c.autoSpeak; save(); $("#chSpk").textContent = c.autoSpeak ? "🔊 Озвучка вкл" : "🔇 Озвучка выкл"; if (!c.autoSpeak && TTS) TTS.cancel(); };
  if ($("#chMic")) $("#chMic").onclick = async () => {
    const mic = $("#chMic");
    if (ST.rec) { try { ST.rec.stop(); } catch (e) {} return; }
    if (TTS) TTS.cancel();
    mic.classList.add("on"); mic.style.background = "var(--red)";
    await wait(250); if (!ST.on) return;
    const before = inp.value.trim();
    ST.rec = listen(txt => { inp.value = (before + " " + txt).trim(); }, (txt, err) => {
      mic.style.background = ""; ST.rec = null;
      if (!txt && err) toast(SR_ERR[err] || SR_ERR["start-failed"]);
    }, false, 20000);
    if (!ST.rec) mic.style.background = "";
  };
  $("#chEnd").onclick = () => {
    const fx = c.fixes;
    $("#stBody").innerHTML = `<div class="big-emoji">💬</div><div class="q-mid" style="text-align:center">Диалог завершён</div>
      <p class="muted" style="text-align:center">Твоих реплик: <b style="color:var(--text)">${c.userN}</b> · исправлений: <b style="color:var(--text)">${fx.length}</b></p>
      ${fx.length ? `<div class="card"><div class="small muted" style="margin-bottom:6px">Над чем поработать:</div>${fx.map(x => `<div class="small" style="padding:5px 0;border-bottom:1px solid var(--line)">✏️ ${esc(x)}</div>`).join("")}
        <button class="btn primary wide" id="chAddFix" style="margin-top:12px">🧠 Добавить исправления в слова</button></div>` : `<div class="card" style="text-align:center"><b>Ни одной ошибки 💪</b></div>`}
      <button class="btn wide big" id="chClose" style="margin-top:12px">Закрыть</button>`;
    $("#chClose").onclick = closeStage;
    if ($("#chAddFix")) $("#chAddFix").onclick = () => {
      let n = 0;
      for (const x of fx) {
        const m = x.match(/^(.*?)\s*(?:→|->)\s*(.*?)(?:\s+[—–-]\s+(.*))?$/);
        if (!m || !m[2]) continue;
        if (addOwn(m[2], `вместо «${m[1]}»${m[3] ? ": " + m[3] : ""}`)) n++;
      }
      save(); $("#chAddFix").disabled = true; toast(n ? `Добавлено в «Мои слова»: ${n}` : "Уже добавлены");
    };
  };
  turn(null);
};

/* ---------- профили ---------- */
function peekProfile(id) {
  if (id === PROF.cur) return S;
  try { return JSON.parse(localStorage.getItem(dataKey(id))) || null; } catch (e) { return null; }
}
function profilesSheet() {
  openSheet(`<div class="sheet-title">Профили</div>
    <p class="small muted" style="margin-top:-6px">У каждого профиля свой уровень, слова, прогресс и настройки. Удобно, если телефоном пользуется несколько человек.</p>
    ${PROF.list.map(x => { const d = peekProfile(x.id), pl = d && d.profile;
      return `<div class="li" style="cursor:default"><span style="font-size:24px">${x.emoji}</span>
        <div class="lb"><div class="lt">${esc(x.name)}${x.id === PROF.cur ? ` <span class="chip ok">сейчас</span>` : ""}</div>
        <div class="ls">${pl ? `уровень ${pl.level} · слов ${Object.keys(d.cards || {}).length}` : "тест уровня не пройден"}</div></div>
        ${x.id !== PROF.cur ? `<button class="btn sm primary" data-sw="${x.id}">Выбрать</button>` : ""}
        <button class="icon-btn" data-ed="${x.id}" aria-label="Изменить">✏️</button></div>`; }).join("")}
    <button class="btn wide" id="pNew" style="margin-top:10px">＋ Новый профиль</button>`);
  $$("[data-sw]").forEach(b => b.onclick = () => switchProfile(b.dataset.sw));
  $$("[data-ed]").forEach(b => b.onclick = () => profileForm(b.dataset.ed));
  $("#pNew").onclick = () => profileForm(null);
}
function profileForm(id) {
  const x = id ? PROF.list.find(p => p.id === id) : { name: "", emoji: EMOJI[PROF.list.length % EMOJI.length] };
  let emoji = x.emoji;
  openSheet(`<div class="sheet-title">${id ? "Профиль" : "Новый профиль"}</div>
    <div class="field"><label>Имя</label><input id="pName" value="${esc(x.name)}" maxlength="20" placeholder="например, Маша"></div>
    <div class="field"><label>Значок</label><div class="vgrid" id="pEm" style="margin-top:0">${EMOJI.map(e => `<button data-e="${e}" class="${e === emoji ? "on" : ""}" style="font-size:22px;padding:8px 10px">${e}</button>`).join("")}</div></div>
    <button class="btn primary wide" id="pSave">${id ? "Сохранить" : "Создать и перейти"}</button>
    ${id && PROF.list.length > 1 ? `<button class="btn danger wide" id="pDel" style="margin-top:8px">Удалить профиль</button>` : ""}
    <button class="btn ghost wide" id="pBack" style="margin-top:8px">Назад</button>`);
  $$("#pEm button").forEach(b => b.onclick = () => { emoji = b.dataset.e; $$("#pEm button").forEach(y => y.classList.toggle("on", y === b)); });
  $("#pBack").onclick = profilesSheet;
  $("#pSave").onclick = () => {
    const name = $("#pName").value.trim();
    if (!name) return toast("Введи имя");
    if (id) { x.name = name; x.emoji = emoji; saveProfiles(); render(); profilesSheet(); return; }
    const np = { id: "p" + Date.now().toString(36), name, emoji };
    PROF.list.push(np); saveProfiles(); switchProfile(np.id);
  };
  if ($("#pDel")) $("#pDel").onclick = () => {
    if (!confirm(`Удалить профиль «${x.name}» со всем прогрессом? Это не отменить.`)) return;
    try { localStorage.removeItem(dataKey(id)); } catch (e) {}
    PROF.list = PROF.list.filter(p => p.id !== id);
    if (PROF.cur === id) { PROF.cur = PROF.list[0].id; saveProfiles(); S = load(); go("today"); }
    else saveProfiles();
    profilesSheet(); render();
  };
}
function switchProfile(id) {
  if (ST.on) closeStage();
  save();
  PROF.cur = id; saveProfiles();
  S = load();
  closeSheet(); go("today");
  toast(`${curProfile().emoji} ${curProfile().name}`);
}

/* ---------- лист ---------- */
function openSheet(html) { $("#sheetBody").innerHTML = html; $("#shade").classList.add("on"); $("#sheet").classList.add("on"); $("#sheet").scrollTop = 0; }
function closeSheet() { $("#shade").classList.remove("on"); $("#sheet").classList.remove("on"); }
$("#shade").onclick = closeSheet;

/* ---------- запуск ---------- */
render();
document.addEventListener("visibilitychange", () => { if (!document.hidden && !ST.on) render(); else save(); });
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
